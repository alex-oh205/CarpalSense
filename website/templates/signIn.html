{% extends 'layout.html' %}

{% block scripts %}
    <script type="module" src="{{ url_for('static', filename='/js/signIn.js') }}"></script>
{% endblock scripts %}

{% block main %}
    <br>
    <!-- Heading -->
    <section class="text-center heading">
        <div class="container">
            <br>
            <h1>Log In</h1>
            <br>
        </div>
    </section>

    <!-- Sign In -->
    <section class="signIn">
        <div class="container-sm signUpForm">
            <div class="row w-100">
                <form class="col-sm-7 col-md-6 col-lg-5 col-xl-4 mx-auto d-flex flex-column align-items-left needs-validation" novalidate>
                    <div id="alertPlaceholder">

                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="loginEmail">Email</label>
                        <input type="email" placeholder="Email" id="loginEmail" class="form-control" pattern="^[a-zA-Z0-9._%+-]+@ctemc\.org$" required>
                        <div class="invalid-feedback">Please enter a valid email address.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="loginPassword">Password</label>
                        <input type="password" placeholder="Password" id="loginPassword" class="form-control" required>
                        <div class="invalid-feedback">Please enter your password.</div>
                    </div>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" role="switch" id="keepLoggedInSwitch">
                        <label class="form-check-label" for="keepLoggedInSwitch">Keep me signed in</label>
                    </div>
                    <button type="submit" id="signIn" name="signIn" class="btn btn-outline-primary mb-4 w-100">Sign In</button>
                    <a href="{{ url_for('signUp') }}" class="badge bg-secondary py-1 text-decoration-none align-self-center">Don't have an account?</a>
                </form>
            </div>
            
        </div>
    </section>
{% endblock main %}
