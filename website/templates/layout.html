<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- If a title is passed as a parameter, use that, otherwise use the default -->
    {% if title %}
        <title>{{ title }}</title>
    {% else %}
        <title>CarpalSense</title>
    {% endif %}

    <!-- Bootstrap 5 CSS, Icons and custom CSS file links -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
            rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
            crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
            crossorigin="anonymous"></script>

    <script type="module" src="{{ url_for('static', filename='js/navbar.js') }}"></script>
    
    {% block scripts %} {% endblock scripts %}
</head>

<body>
    <!-- Navbar -->
    <header>
        {% include 'includes/_navbar.html' %}
    </header>

    <!-- Page Content -->
    <main>
        {% block main %} {% endblock main %}
    </main>
    
    <!-- Footer -->
    {% include 'includes/_footer.html' %}
    
</body>
</html>
